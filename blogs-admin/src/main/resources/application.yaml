server:
  port: 8080

spring:
  application:
    name: blogs
  profiles:
    active: dev # 激活开发环境配置 (对应 application-dev.yml)

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开发环境控制台打印 SQL
    map-underscore-to-camel-case: true # 开启下划线转驼峰
  global-config:
    db-config:
      logic-delete-field: deleted # 逻辑删除全局字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# 认证与安全配置
blogs:
  jwt:
    # HS256 密钥必须由环境变量 JWT_SECRET 注入，不少于 32 字节，禁止写入仓库/数据库/日志
    secret: ${JWT_SECRET:}
    expire-seconds: 86400 # token 有效期 24 小时（契约 6.2.1 冻结）
    issuer: blogs
  cors:
    allowed-origins:
      - http://localhost:5173 # 前端 Vite 开发服务器；走 proxy 时不会触发跨域
