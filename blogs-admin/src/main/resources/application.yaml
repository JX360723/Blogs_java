server:
  port: 8080

spring:
  application:
    name: blogs
  profiles:
    active: dev # 激活开发环境配置 (对应 application-dev.yml)

# MyBatis-Plus 配置
# 注意：log-impl（SQL 打印）只在 application-dev.yml 里配置，
# 不要写在这里，否则生产环境会打印全量 SQL 与参数
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启下划线转驼峰
  global-config:
    db-config:
      logic-delete-field: deleted # 逻辑删除全局字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# 健康检查：SecurityConfig 已放行 /actuator/health，这里只暴露 health，
# 不开放 env / beans / heapdump 等敏感端点
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # 当前代码没有使用 Redis（blogs-common 里保留了 starter 与 dev 连接配置，属预留），
    # 但 Spring Boot 会自动注册 RedisHealthIndicator：本机/测试环境没起 Redis 时
    # /actuator/health 直接返回 503 DOWN，K8s 探活与监控会误判服务不可用。
    # 真正引入缓存后再把这里改回 true，并给 Redis 配好探活超时。
    redis:
      enabled: false
    # 数据源是核心依赖，必须参与健康检查：库连不上时探活要能立刻失败
    db:
      enabled: true

# 认证与安全配置
blogs:
  jwt:
    # HS256 密钥必须由环境变量 JWT_SECRET 注入，不少于 32 字节，禁止写入仓库/数据库/日志
    secret: ${JWT_SECRET:}
    expire-seconds: 86400 # token 有效期 24 小时（契约 6.2.1 冻结）
    issuer: blogs
  cors:
    allowed-origins:
      - http://localhost:5173 # 前端 Vite 开发服务器；走 proxy 时不会触发跨域
