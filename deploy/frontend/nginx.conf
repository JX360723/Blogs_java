# 博客前端 Nginx 配置（骨架草案）
# 托管 Vite 构建产物，并将 /api 反代到后端容器（compose 服务名 backend）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体大小限制（文章正文可能较大，按需调整）
    client_max_body_size 20m;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        # 上传接口走这里：与后端 spring.servlet.multipart.max-request-size=6MB 对齐，
        # 超大请求在 nginx 层就 413，不占用后端连接
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传图片反代到 backend（backend 的 WebMvcUploadConfig 做了 /uploads/** 静态映射）。
    # 必须 ^~：否则下面那条 \.(png|jpg|...)$ 的正则 location 优先级更高，
    # 图片请求会被截到本地 try_files 而全部 404
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片必须按声明的 Content-Type 渲染，禁止浏览器猜类型（防把图片当脚本执行）。
        # 缓存头由后端 WebMvcUploadConfig 下发（max-age=31536000, public, immutable），
        # 此处不再重复 add_header Cache-Control，否则会输出两条同名头反而让缓存策略失效
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
